name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      #  STEP 1: Setup SSH FIRST
      - name: Setup SSH using PEM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2.pem
          chmod 400 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      #  STEP 2: Test SSH (AFTER setup)
      - name: Test SSH
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo connected"

      #  STEP 3: Deploy
      - name: Deploy
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd skill-share-hub-backend
            git pull origin main
            npm install
            npm run build
            pm2 restart backend || pm2 start dist/server.js --name backend
          EOF
